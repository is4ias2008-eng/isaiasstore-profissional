<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsaiasStore</title>

<!-- Google login -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body {
  margin: 0;
    font-family: Arial;
      background: #0f0f0f;
        color: white;
        }

        header {
          background: #ff3c3c;
            padding: 15px;
              display: flex;
                justify-content: space-between;
                }

                .container {
                  padding: 20px;
                  }

                  .card {
                    background: #1a1a1a;
                      padding: 20px;
                        border-radius: 15px;
                          margin-top: 15px;
                          }

                          button {
                            padding: 12px;
                              border-radius: 10px;
                                border: none;
                                  cursor: pointer;
                                  }

                                  .primary {
                                    background: #ff3c3c;
                                      color: white;
                                      }

                                      .secondary {
                                        background: #333;
                                          color: white;
                                          }

                                          input {
                                            width: 100%;
                                              padding: 12px;
                                                margin-top: 8px;
                                                  border-radius: 10px;
                                                    border: none;
                                                    }
                                                    </style>
                                                    </head>

                                                    <body>

                                                    <header>
                                                      <h2>🔥 IsaiasStore 🔥</h2>
                                                        <button onclick="logout()">Sair</button>
                                                        </header>

                                                        <div class="container">

                                                          <!-- LOGIN -->
                                                            <div id="loginPage" class="card">
                                                                <h2>Área de acesso</h2>

                                                                    <button class="primary" onclick="mostrarLogin()">Entrar</button>
                                                                        <button class="secondary" onclick="mostrarCadastro()">Criar conta</button>

                                                                            <br><br>

                                                                                <!-- Google -->
                                                                                    <div id="g_id_onload"
                                                                                          data-client_id="SEU_CLIENT_ID_AQUI"
                                                                                                data-callback="handleGoogle"
                                                                                                    ></div>

                                                                                                        <div class="g_id_signin"></div>

                                                                                                            <!-- LOGIN -->
                                                                                                                <div id="loginBox">
                                                                                                                      <h3>Entrar</h3>
                                                                                                                            <input id="user" placeholder="Usuário">
                                                                                                                                  <input id="pass" type="password" placeholder="Senha">
                                                                                                                                        <button class="primary" onclick="login()">Entrar</button>

                                                                                                                                              <p onclick="mostrarRecuperar()" style="cursor:pointer;color:#aaa">
                                                                                                                                                      Esqueci minha senha
                                                                                                                                                            </p>
                                                                                                                                                                </div>

                                                                                                                                                                    <!-- CADASTRO -->
                                                                                                                                                                        <div id="registerBox" style="display:none">
                                                                                                                                                                              <h3>Criar conta</h3>
                                                                                                                                                                                    <input id="name" placeholder="Nome">
                                                                                                                                                                                          <input id="userReg" placeholder="Usuário">
                                                                                                                                                                                                <input id="passReg" type="password" placeholder="Senha">
                                                                                                                                                                                                      <input id="confirm" type="password" placeholder="Confirmar senha">
                                                                                                                                                                                                            <button class="primary" onclick="registrar()">Criar</button>
                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                    <!-- RECUPERAR -->
                                                                                                                                                                                                                        <div id="recoverBox" style="display:none">
                                                                                                                                                                                                                              <h3>Recuperar senha</h3>
                                                                                                                                                                                                                                    <input id="recoverUser" placeholder="Usuário">
                                                                                                                                                                                                                                          <button class="primary" onclick="recuperar()">Enviar</button>
                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                function mostrarLogin() {
                                                                                                                                                                                                                                                  loginBox.style.display = "block";
                                                                                                                                                                                                                                                    registerBox.style.display = "none";
                                                                                                                                                                                                                                                      recoverBox.style.display = "none";
                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                      function mostrarCadastro() {
                                                                                                                                                                                                                                                        loginBox.style.display = "none";
                                                                                                                                                                                                                                                          registerBox.style.display = "block";
                                                                                                                                                                                                                                                            recoverBox.style.display = "none";
                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                            function mostrarRecuperar() {
                                                                                                                                                                                                                                                              loginBox.style.display = "none";
                                                                                                                                                                                                                                                                registerBox.style.display = "none";
                                                                                                                                                                                                                                                                  recoverBox.style.display = "block";
                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                  async function login() {
                                                                                                                                                                                                                                                                    const username = user.value;
                                                                                                                                                                                                                                                                      const password = pass.value;

                                                                                                                                                                                                                                                                        const res = await fetch("/api/login", {
                                                                                                                                                                                                                                                                            method: "POST",
                                                                                                                                                                                                                                                                                headers: {"Content-Type":"application/json"},
                                                                                                                                                                                                                                                                                    body: JSON.stringify({ username, password })
                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                        const data = await res.json();

                                                                                                                                                                                                                                                                                          if (data.token) {
                                                                                                                                                                                                                                                                                              alert("Login OK");
                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                    alert(data.error);
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                      async function registrar() {
                                                                                                                                                                                                                                                                                                        const res = await fetch("/api/register", {
                                                                                                                                                                                                                                                                                                            method: "POST",
                                                                                                                                                                                                                                                                                                                headers: {"Content-Type":"application/json"},
                                                                                                                                                                                                                                                                                                                    body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                          name: name.value,
                                                                                                                                                                                                                                                                                                                                username: userReg.value,
                                                                                                                                                                                                                                                                                                                                      password: passReg.value,
                                                                                                                                                                                                                                                                                                                                            confirmPassword: confirm.value
                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                  });

                                                                                                                                                                                                                                                                                                                                                    const data = await res.json();

                                                                                                                                                                                                                                                                                                                                                      if (data.ok) {
                                                                                                                                                                                                                                                                                                                                                          alert("Conta criada!");
                                                                                                                                                                                                                                                                                                                                                              mostrarLogin();
                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                    alert(data.error);
                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                      async function recuperar() {
                                                                                                                                                                                                                                                                                                                                                                        alert("Se existir conta, será enviado recuperação.");
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                        function handleGoogle(response) {
                                                                                                                                                                                                                                                                                                                                                                          alert("Login Google funcionando 🔥");
                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                          function logout() {
                                                                                                                                                                                                                                                                                                                                                                            alert("Saiu");
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                            </html>
