<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsaiasStore</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0f0f0f;color:white}header{background:#ff3c3c;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:23px}.menu-btn{background:#111;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:22px}.sidebar{position:fixed;left:-280px;top:0;width:270px;height:100%;background:#181818;z-index:50;padding:20px;transition:.25s;box-shadow:0 0 20px #000}.sidebar.open{left:0}.sidebar h2{color:#ff3c3c}.sidebar button{display:block;width:100%;margin:8px 0;background:#292929;color:white;border:0;border-radius:8px;padding:12px;text-align:left}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40}.overlay.open{display:block}.container{padding:18px;max-width:1000px;margin:auto}.hero{background:linear-gradient(135deg,#ff3c3c,#ff8800);border-radius:18px;padding:24px;margin-bottom:18px}.card{background:#1a1a1a;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 0 0 1px #242424}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0}button.primary{background:#ff3c3c;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}button.secondary{background:#2d2d2d;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.product img{width:100%;height:210px;object-fit:cover;border-radius:14px}.price{color:#ff3c3c;font-size:24px;font-weight:bold}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:#222;border-radius:14px;padding:16px}.stat b{font-size:26px;color:#ff3c3c}.tag{display:inline-block;background:#ff3c3c;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<header><button class="menu-btn" onclick="toggleMenu()">☰</button><h1>🔥 IsaiasStore 🔥</h1><button class="menu-btn" onclick="logout()">↪</button></header>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<aside id="sidebar" class="sidebar"><h2>Menu</h2><div id="menuItems"></div></aside>
<div class="container">
<section class="hero"><h2>Achadinhos e ofertas da Shopee 🔥</h2><p>Produtos chamativos pra clicar, conferir e comprar direto na Shopee.</p></section>
<section id="authArea" class="card"><h2>Entrar ou criar conta</h2><input id="user" placeholder="Usuário"><input id="pass" type="password" placeholder="Senha"><button class="primary" onclick="login()">Entrar</button> <button class="secondary" onclick="register()">Criar conta</button></section>
<section id="adminArea" class="hidden">
<div class="card"><h2>Painel Admin 👑</h2><div class="stats"><div class="stat"><p>Cliques totais</p><b id="statClicks">0</b></div><div class="stat"><p>Produtos</p><b id="statProducts">0</b></div><div class="stat"><p>Loja</p><b id="statStore">-</b></div></div><p id="bestProduct"></p><button class="secondary" onclick="toggleStore()">Abrir/Fechar loja</button></div>
<div class="card"><h2>Adicionar produto</h2><input id="pName" placeholder="Nome do produto"><input id="pPrice" placeholder="Preço. Ex: 29,90"><input id="pImage" placeholder="URL da imagem"><input id="pLink" placeholder="Link afiliado Shopee"><select id="pCategory"><option>Promoções</option><option>Eletrônicos</option><option>Casa</option><option>Moda</option><option>Beleza</option></select><label><input id="pOffer" type="checkbox"> Oferta do dia</label><br><br><button class="primary" onclick="addProduct()">Adicionar</button></div>
</section>
<section id="productsArea"><h2>Produtos</h2><div id="categoryButtons" class="card"></div><div id="products" class="grid"></div></section>
</div>
<script>
let token=localStorage.getItem("token")||"",role=localStorage.getItem("role")||"",currentCategory="Todos",productsCache=[],storeOpenCache=true;
function toggleMenu(){sidebar.classList.toggle("open");overlay.classList.toggle("open")}
function renderMenu(){let m=menuItems;if(role==="admin"){m.innerHTML=`<button onclick="scrollToId('adminArea')">👑 Painel Admin</button><button onclick="scrollToId('productsArea')">🛍️ Produtos</button><button onclick="setCategory('Promoções')">🔥 Promoções</button><button onclick="setCategory('Eletrônicos')">📱 Eletrônicos</button><button onclick="setCategory('Casa')">🏠 Casa</button><button onclick="logout()">Sair</button>`}else if(token){m.innerHTML=`<button onclick="scrollToId('productsArea')">🛍️ Produtos</button><button onclick="setCategory('Promoções')">🔥 Promoções</button><button onclick="setCategory('Eletrônicos')">📱 Eletrônicos</button><button onclick="setCategory('Casa')">🏠 Casa</button><button onclick="setCategory('Moda')">👕 Moda</button><button onclick="logout()">Sair</button>`}else{m.innerHTML=`<button onclick="scrollToId('authArea')">Entrar</button><button onclick="scrollToId('productsArea')">Ver produtos</button><button onclick="setCategory('Promoções')">🔥 Promoções</button>`}}
function scrollToId(id){toggleMenu();document.getElementById(id).scrollIntoView({behavior:"smooth"})}
async function register(){let username=user.value.trim(),password=pass.value.trim();let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});let d=await r.json();alert(d.ok?"Conta criada! Agora clique em Entrar.":d.error)}
async function login(){let username=user.value.trim(),password=pass.value.trim();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});let d=await r.json();if(d.token){token=d.token;role=d.role;localStorage.setItem("token",token);localStorage.setItem("role",role);alert(role==="admin"?"Login admin OK 🔥":"Login OK!");refresh()}else alert(d.error||"Erro no login")}
function logout(){localStorage.clear();token="";role="";refresh()}
async function loadProducts(){let r=await fetch("/api/products");let d=await r.json();productsCache=d.products||[];storeOpenCache=d.storeOpen;renderProducts()}
function renderCategories(){let cats=["Todos","Promoções","Eletrônicos","Casa","Moda","Beleza"];categoryButtons.innerHTML=cats.map(c=>`<button class="${c===currentCategory?'primary':'secondary'}" onclick="setCategory('${c}')">${c}</button>`).join(" ")}
function setCategory(c){currentCategory=c;renderProducts();renderCategories();if(sidebar.classList.contains("open"))toggleMenu()}
function renderProducts(){renderCategories();if(!storeOpenCache){products.innerHTML=`<div class="card"><h2>Loja fechada no momento</h2><p>Volte mais tarde.</p></div>`;return}let list=productsCache.filter(p=>currentCategory==="Todos"||p.category===currentCategory);if(!list.length){products.innerHTML=`<div class="card"><p>Nenhum produto nessa categoria.</p></div>`;return}products.innerHTML=list.map(p=>`<div class="card product">${p.offer?'<span class="tag">OFERTA 🔥</span>':''}<img src="${p.image}" alt="${p.name}"><h3>${p.name}</h3><p>${p.category}</p><p class="price">R$ ${p.price}</p><button class="primary" onclick="buy(${p.id})">Ver na Shopee 🔥</button>${role==="admin"?`<p>Cliques: ${p.clicks||0}</p><button class="secondary" onclick="deleteProduct(${p.id})">Excluir</button>`:""}</div>`).join("")}
async function buy(id){let r=await fetch(`/api/products/${id}/click`,{method:"POST"});let d=await r.json();if(d.link)window.open(d.link,"_blank");loadProducts()}
async function loadAdmin(){if(role!=="admin")return;let r=await fetch("/api/admin/stats",{headers:{Authorization:"Bearer "+token}});let d=await r.json();statClicks.innerText=d.totalClicks||0;statProducts.innerText=d.totalProducts||0;statStore.innerText=d.storeOpen?"Aberta":"Fechada";bestProduct.innerText=d.bestProduct?`Mais clicado: ${d.bestProduct.name} (${d.bestProduct.clicks} cliques)`:""}
async function addProduct(){let body={name:pName.value,price:pPrice.value,image:pImage.value,link:pLink.value,category:pCategory.value,offer:pOffer.checked};let r=await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body)});let d=await r.json();alert(d.ok?"Produto adicionado!":d.error);refresh()}
async function deleteProduct(id){if(!confirm("Excluir esse produto?"))return;await fetch(`/api/products/${id}`,{method:"DELETE",headers:{Authorization:"Bearer "+token}});refresh()}
async function toggleStore(){await fetch("/api/admin/store-open",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({open:!storeOpenCache})});refresh()}
async function refresh(){authArea.classList.toggle("hidden",!!token);adminArea.classList.toggle("hidden",role!=="admin");renderMenu();await loadProducts();await loadAdmin()}
refresh();
</script>
</body>
</html>
